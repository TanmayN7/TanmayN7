<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes and Pseudo Element</title>
    <style>
        .block {
            border: 2px double;
            height: 250px;
            width: 250px;
            text-align: center;
        }

        .block:hover {
            background-color: goldenrod;
            font-weight: bold;
            font-family: cursive;
            font-size: 30px
        }

        a:visited {
            color: violet;
        }

        a:focus {
            background-color: blue;
            color: red;
            font-size: 20px
        }

        a:active {
            color: yellow;
        }

        div:empty {
            border: 1px double;
            height: 50px;
            width: 50px;
        }

        span:first-child {
            background-color: darkmagenta;
            color: darkorange;
        }
    </style>
</head>

<body>
    <div class="block">BLOCK</div>

    <a href="http://www.google.com" target="_blank">google</a>
    <a href="http://www.facebook.com" target="_blank">facebook</a>
    <a href="http://www.youtube.com" target="_blank">youtube</a>

    <div>abc</div>
    <div>123</div>
    <div></div>
    <div>pqr</div>
    <div>xyz</div>
    
    <div>
        <span>one</span>
        <span>two</span>
        <span>three</span>
        <span>four</span>
        <span>five</span>
    </div>


</body>

</html>
