<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Tag / Form tag</title>
    <style>
        h3 {
            font-weight: bold;
            text-align: center;
        }

        .title {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }

        .formcont {
            border: 3px solid;
            margin: 20px auto;
            padding: 10px;
            width: 600px;
            background-color: #ccc;
        }

        li {
            list-style: none;
            margin: 5px;
            padding: 5px;
            background-color: #fff;
        }
    </style>
</head>

<body>
    <form action="http://tanmay123.com/details" method="get">
        <h3>PJLCE</h3>
        <ul class="formcont">
            <li class="title">College Students Detalis</li>
            <li> <input type="text" name="usrname" id="" placeholder="User Name"></li>
            <li> <input type="password" name="pswd" id="" placeholder="Password" maxlength="8"></li>
            <li> Gender : <input type="radio" name="gendr" value="Male"> Male
                <input type="radio" name="gendr" value="Female"> Female
            </li>
            <li>Language :
                <input type="checkbox" value="eng">English
                <input type="checkbox" value="mar" checked disabled>Marathi
                <input type="checkbox" value="hin">Hindi
            </li>
            <li> Country : <input type="text" name="myCountry"></li>
            <li>State :
                <select name="State" id="">
                    <option value="MH">Maharashtra</option>
                    <option value="GJ">Gujrat</option>
                    <option value="GO">Goa</option>
                    <option value="MP">Madhaya Pradesh</option>
                </select>
            </li>
            <li>
                Feedback : <textarea name="feedback" id=""></textarea>
            </li>
            <li><input type="submit" value="submit"></li>

        </ul>
    </form>
</body>

</html>
