<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstrating CSS Margin & Padding Prop</title>
    <style>
        .block1,
        .block2,
        .block3,
        .block4,
        .block5{
            border: 2px solid;
            height: 180px;
            width: 180px; 
            text-align: center;   
        }
        .block1{
            background-color: blueviolet;
        }
        .block2{
            /* here i have use css padding */
            background-color: violet;
            padding: 30px;
        }
        .block3{
            /* here i have use css margin */
            background-color: darkviolet;
            margin: 50px;
        }
        .block4{
            background-color: purple;
        }
        .block5{
            background-color: pink;
        }
    </style>
</head>
<body>
    <!-- here i have use class element in div tag -->
    <div class="block1">Block1</div>
    <div class="block2">Block2</div>
    <div class="block3">Block3</div>
    <div class="block4">Block4</div>
    <div class="block5">Block5</div>
</body>
</html>
