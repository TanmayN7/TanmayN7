<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Typecasting</title>
</head>
<body>
    <script>
        var sname = prompt("Enter Name ");
        console.log("Name : " + sname);
        var sage = prompt("Enter Age ");
        sage = parseInt(sage);
        console.log("Age is " + sage);
        var m1 = prompt("marks 1 ");
         m1 = parseInt(m1);
         console.log(m1)
        var m2 = prompt("marks 2 ");
        m2 = parseInt(m2);
        console.log(m2);
        var m3 = prompt("merks m3 ");
        m3 = parseInt(m3);
        console.log(m3);

        var totalmarks = m1+m2+m3;
        console.log("The total marks is "+totalmarks);
        var avg = totalmarks / 3;
        console.log("The avg marks are "+avg);

    </script>
</body>
</html>
