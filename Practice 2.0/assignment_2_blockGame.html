<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Game</title>
    <style>
        .block0{
            border: 2px solid;
            text-align: center;
            margin: 5px;
            padding: 5px;
        }
        .block{
            border: 1px solid;
            text-align: center;
            height: 100px;
            width: 100px;
            padding: 5px;
            margin: 5px;
        }
        .block1,
        .block9,
        .block11{
            background-color: yellow;
        }

        .block2,
        .block7,
        .block10{
            background-color: red;
        }

        .block4,
        .block6{
            background-color: gray;
        }

        .block3,
        .block5,
        .block8{
            background-color: blue;
        }

        .block1{
            float: left;
        }
        .block2{
            float: left;
        }
        .block3{
            float: right;
        }
        .block4{
            float: left;
            clear: both;
        }
        .block5{
            float: left;
            clear: both;
            
        }
        .block6{
            float: right;
            
        }
        .block7{
            float: right;
            
        }
        .block8{
            float: right;
            
        }
        .block9{
            float: left;
            clear: both;
        }
        .block10{
            float: left;
        }
        .block11{
            float: left;
        }
        .block12{
            background-color: yellowgreen;
            float: left;
            clear: both;
        }

    </style>
</head>
<body>
    <div class="block0">Block Game</div>
    <div class="block block1">1</div>
    <div class="block block2">2</div>
    <div class="block block3">3</div>
    <div class="block block4">4</div>
    <div class="block block5">5</div>
    <div class="block block6">8</div>
    <div class="block block7">7</div>
    <div class="block block8">6</div>
    <div class="block block9">9</div>
    <div class="block block10">10</div>
    <div class="block block11">11</div>
    <div class="block block12">12</div>
</body>
</html>
