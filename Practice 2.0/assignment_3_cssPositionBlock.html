<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Position Block</title>
</head>
<style>
    .block0{
        border: 2px dashed;
        padding: 5px;
        margin: 5px;
        height: 20px;
        text-align: center;
        font-weight: bold;
    }
    .block{
        border: 1px solid;
        height: 150px;
        width: 150px;
        position: absolute;
    }
    .block1{
        background-color: yellow;
        top: 100px;
    }
    .block2{
        background-color: rgb(2, 187, 248);
        top: 170px;
        left: 70px;
    }
    .block3{
        background-color: yellow;
         top: 170px;
        left: 1600px;
    }
    .block4{
        background-color: rgb(2, 187, 248);
        top: 100px;
        left: 1650px;
    }
    .block5{
        background-color: brown;
        top: 350px;
        left: 730px;
    }
    .block6{
        background-color: gray;
        top: 350px;
        left: 970px;
    }
    .block7{
        background-color: gray;
        top: 550px;
        left: 730px;
    }
    .block8{
        background-color: purple;
        top: 550px;
        left: 970px;
    }
    .block9{
        background-color: orange;
        top: 450px;
        left: 850px;
    }
    .block10{
        background-color: brown;
        top: 800px;
        left: 70px;
    }
    .block11{
        background-color: purple;
        top: 870px;
    }
    .block12{
        background-color: brown;
        top: 800px;
        left: 1600px;
    }
    .block13{
        background-color: gray;
        top: 870px;
        left: 1650px;
    }
    .foot{
        border: 2px solid;  
        height: 20px;
        text-align: center;
        position: absolute;
        width: 100%;
        top: 1100px;
    }
</style>
<body>
    <div class="block0">Css Position Block</div>
    <div class="block block1"></div>
    <div class="block block2"></div>
    <div class="block block3"></div>
    <div class="block block4"></div>
    <div class="block block5"></div>
    <div class="block block6"></div>
    <div class="block block7"></div>
    <div class="block block8"></div>
    <div class="block block9"></div>
    <div class="block block10"></div>
    <div class="block block11"></div>
    <div class="block block12"></div>
    <div class="block block13"></div>
    <div class="foot">@copyrights 2025</div>
</body>
</html>
