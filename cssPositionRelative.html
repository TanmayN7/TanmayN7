<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postions</title>
    <style>
        .block1{
            border: 3px solid;
            width: 180px;
            height: 180px;
            text-align: center;
        }
        .block2{
            border: 3px solid;
            width: 180px;
            height: 180px;
            text-align: center;
        }
        .block3{
            border: 3px solid;
            width: 180px;
            height: 180px;
            text-align: center;
        }
        /* in position relative DOM elements can be moved from its relative position 
        but no other DOM elemnts can aquire that position */
        .block2{
            position: relative;
            left: 300px;
            top: 80px;
        }
    </style>
</head>
<body>
    <div class="block1">Block1</div>
    <div class="block2">Block3</div>
    <div class="block3">Block2</div>
</body>
</html>
