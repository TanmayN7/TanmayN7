<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo  Class 2</title>
    <style>
        span:first-of-type{
            background-color: chartreuse;
        }

        span:nth-child(5){
            background-color: chocolate;
        }
        span:last-child{
            background-color: cyan;
        }
        p:only-child{
            background-color: deeppink;
        }

    </style>
</head> 
<body>
    <div>
        <p>para</p>
        <span>span</span>
        <h1>h1</h1>
        <h3>h3</h3>
        <span>span2</span>
        <span>span3</span>
        <p>para2</p>
    </div>
</body>
</html>
