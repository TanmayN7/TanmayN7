<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postions</title>
    <style>
        .block1,
        .block2,
        .block3 {
            border: 3px solid;
            width: 180px;
            height: 180px;
            text-align: center;
        }
        /* in position Fixed DOM elements will be fixed to its position */
        .block2 {
            position: fixed;
            left: 300px;
            top: 80px;
            background-color: green;
        }
        .container{
            border: 4px solid;
            height: 400px;
            width: 500px;
            overflow: auto;
        }
        h3{
            border: 2px solid;
            text-align: center;
        }
    </style>
</head>

<body>
    <h3>cssPositionFixed</h3>
    <div class="container">
        <div class="block1">Block1</div>
        <div class="block2">Block2</div>
        <div class="block3">Block3</div>
        <div class="block1">Block1</div>
        <div class="block2">Block2</div>
        <div class="block3">Block3</div>

        <div class="block3">Block3</div>

        <div class="block3">Block3</div>
       
</body>

</html>
