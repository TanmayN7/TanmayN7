<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Using Div</title>
    <style>
        .tableCont {
            border: 2px solid;
            height: 500px;
            width: 610px;
        }
        .tablehead div,
        .tableBody div{
            border: 2px solid;
            width: 100px;
            display: inline-block;
            text-align: center;
            margin: 2px;
            padding: 5px;
            
        }
        .tablehead div{
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h3>Table Structure Through div</h3>
    <div class="tableCont">
        <div class="tablehead">
            <div>Name</div>
            <div>Class</div>
            <div>Roll No</div>
            <div>Sex</div>
            <div>City</div>
        </div>
        <div class="tableBody">
            <div>Tanmay</div>
            <div>Btech</div>
            <div>66</div>
            <div>Male</div>
            <div>Chanda</div>
        </div>
        <div class="tableBody">
            <div>Tanmay</div>
            <div>Btech</div>
            <div>66</div>
            <div>Male</div>
            <div>Chanda</div>
        </div>
        <div class="tableBody">
            <div>Tanmay</div>
            <div>Btech</div>
            <div>66</div>
            <div>Male</div>
            <div>Chanda</div>
        </div>

    </div>

</body>

</html>
