<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postions</title>
    <style>
        .block1,
        .block2,
        .block3,
        .block4,
        .block5,
        .block6,
        .block7 {
            border: 3px solid;
            width: 180px;
            height: 180px;
            text-align: center;
        }

        /* in position Sticky DOM elements will be sticked to its position(it will move relative to the screen but will not pushed out of the screen) */
        .block2 {
            position: sticky;
            left: 300px;
            top: 10px;
            background-color: green;
        }

        .container {
            border: 4px solid;
            height: 400px;
            width: 500px;
            overflow: auto;
        }

        h3 {
            border: 2px solid;
            text-align: center;
        }
    </style>
</head>

<body>
    <h3>cssPositionSticky</h3>
    <div class="container">
        <div class="block1">Block1</div>
        <div class="block1">Block1</div>
        <div class="block2">Block2</div>
        <div class="block3">Block3</div>
        <div class="block4">Block4</div>
        <div class="block5">Block5</div>
        <div class="block6">Block6</div>
        <div class="block7">Block7</div>
</body>

</html>
