<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Game</title>
    <style>
        .block {
            border: 1px solid;
            height: 50px;
            width: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bolder;
        }

        .block1,
        .block2,
        .block3,
        .block4,
        .block5,
        .block6,
        .block7,
        .block8,
        .block9,
        .block10,
        .block11,
        .block12 {
            border: 1px solid;
            height: 130px;
            width: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;

        }

        .block1 {
            background-color: yellow;
            float: left;
        }

        .block2 {
            background-color: red;
            float: left;
        }

        .block3 {
            background-color: blue;
            float: right;
        }

        .block4 {
            background-color: gray;
            clear: both;
            float: left;
        }

        .block5 {
            background-color: blue;
            clear: left;
            float: left;
        }

        .block6 {
            background-color: gray;
            float: right;
            
        }

        .block7 {
            background-color: red;
            float: right;
            
        }

        .block8 {
            background-color: blue;
            float: right;

        }

        .block9 {
            background-color: orange;
            float: left;
            clear: left;
        }

        .block10 {
            background-color: red;
            float: left;
        }

        .block11 {
            background-color: orange;
            float: left;
        }

        .block12 {
            background-color: yellow;
            float: left;
            clear: both;
        }
    </style>
</head>

<body>
    <div class="block">Block Game</div>
    <div class="block1">1</div>
    <div class="block2">2</div>
    <div class="block3">3</div>
    <div class="block4">4</div>
    <div class="block5">5</div>
    <div class="block8">8</div>
    <div class="block7">7</div>
    <div class="block6">6</div>
    <div class="block9">9</div>
    <div class="block10">10</div>
    <div class="block11">11</div>
    <div class="block12">12</div>
</body>

</html>
